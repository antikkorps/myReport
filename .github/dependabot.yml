version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    # Project-wide 90-day supply-chain delay (see CLAUDE.md). Security
    # Updates bypass this and still open immediately on GHSA advisories.
    cooldown:
      default-days: 90
    groups:
      types:
        patterns:
          - "@types/*"
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-patch:
        dependency-type: production
        update-types:
          - patch
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: chore(ci)
      include: scope
    labels:
      - dependencies
      - ci
